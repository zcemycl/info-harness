[project]
name = "info-harness"
version = "0.1.0"
description = "Information harness — ingest, tool, and agent workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.1.1",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "pydantic>=2.0.0",
    "typer>=0.21.1",
    "tqdm>=4.70.0",
    "boto3>=1.43.94",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src/" = ""

[dependency-groups]
dev = [
    "black>=25.1.0",
    "flake8>=7.1.0",
    "isort>=5.13.0",
    "mypy>=2.1.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.5",
]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.venv
  | \.git
)/
'''

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]
known_first_party = ["cli", "pipeline", "model", "prompt", "agents", "tools", "examples"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
disallow_any_generics = true
disallow_untyped_defs = true
disallow_untyped_globals = true
ignore_missing_imports = true
show_error_codes = true
strict = false
warn_return_any = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
