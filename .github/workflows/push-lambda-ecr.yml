name: Push Lambda to ECR

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - vendor/**
      - src/**
      - .github/workflows/push-lambda-ecr.yml
  workflow_dispatch:

env:
  aws_region: eu-west-2
  lambda_context: .

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'eu-west-2' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Lambda image
        id: build
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          ECR_REPOSITORY: ${{ secrets.LAMBDA_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build \
            --platform linux/amd64 \
            --build-arg PRIVATE_REPO_TOKEN="$PRIVATE_REPO_TOKEN" \
            -t "$IMAGE_URI" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            "$lambda_context"
          docker push "$IMAGE_URI"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Update Lambda function
        env:
          LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
          IMAGE_URI: ${{ steps.build.outputs.image_uri }}
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$IMAGE_URI" \
            --publish > /dev/null
          aws lambda wait function-updated-v2 \
            --function-name "$LAMBDA_FUNCTION_NAME"
