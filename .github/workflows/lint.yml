name: Lint

on:
  push:
    branches:
      - "*"
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: black · isort · flake8 · mypy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          git config --global url."https://x-token-auth:${{ secrets.PRIVATE_REPO_TOKEN }}@github.com".insteadOf "ssh://git@github.com"
          uv sync --group dev

      - name: Black
        run: uv run black --check src tests

      - name: isort
        run: uv run isort --check-only --diff src tests

      - name: flake8
        run: uv run flake8 src tests

      - name: mypy
        run: uv run mypy
